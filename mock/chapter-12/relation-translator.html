<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Relation-to-message translator</title><link rel="stylesheet" href="./chapter-12.css?v=1"/></head>
<body><main class="page"><h1>Relation-to-message translator</h1><p class="subtitle">Change one relation row and compare what the sink would publish.</p><section class="panel">
<div class="controls"><label class="control">Change<select id="change"><option value="insert">Insert a stock row</option><option value="update">Update stock quantity</option><option value="delete">Delete a stock row</option></select></label><label class="control">Envelope<select id="envelope"><option value="upsert">Upsert</option><option value="debezium">Debezium</option></select></label><label class="control">Sink key<select id="key"><option value="product">product_id only</option><option value="composite" selected>(product_id, warehouse_id)</option></select></label><label class="control"><span><input id="snapshot" type="checkbox" checked/> Include initial snapshot</span></label></div>
<div class="table-wrap" id="relation"></div><div class="message" id="message"></div><div class="status" id="status"></div><p class="note">For upsert, the key must uniquely identify each output row. Updates emit the new row; deletes emit a Kafka null-value tombstone. Debezium records carry before/after values.</p>
</section></main><script src="./relation-translator.js?v=1"></script></body></html>
