<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Resource profile over time</title><link rel="stylesheet" href="./chapter-10.css?v=1"/></head>
<body><main class="page"><h1>Resource profile over time</h1><p class="subtitle">A budget that fits steady state may still fail during hydration.</p><section class="panel">
<div class="controls"><label class="control">Steady-state demand<strong><output id="steadyValue"></output> units</strong><input id="steady" type="range" min="20" max="100" step="5" value="55"/></label><label class="control">Hydration peak<strong><output id="peakValue"></output> units</strong><input id="peak" type="range" min="30" max="150" step="5" value="105"/></label><label class="control">Available resource budget<strong><output id="budgetValue"></output> units</strong><input id="budget" type="range" min="30" max="140" step="5" value="75"/></label><label class="control">Hydration duration<strong><output id="durationValue"></output> sec</strong><input id="duration" type="range" min="10" max="40" step="5" value="20"/></label><label class="control">Recovery loop<input id="loop" type="checkbox"/> Repeat restart after failed hydration</label></div>
<svg class="resource-chart" viewBox="0 0 600 220" role="img" aria-label="Resource demand over time compared with capacity"><g id="chart"></g></svg><div class="legend"><span><i style="background:#aaa4e1"></i>resource demand</span><span><i style="background:#a33a35"></i>available budget</span></div><div class="status" id="status"></div><p class="note">The profile is an illustrative fixture, not a universal multiplier. Compare the peak with the budget separately from steady-state demand.</p>
</section></main><script src="./resource-profile.js?v=1"></script></body></html>
