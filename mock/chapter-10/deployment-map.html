<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Interactive deployment map</title><link rel="stylesheet" href="./chapter-10.css?v=1"/></head>
<body><main class="page"><h1>Interactive deployment map</h1><p class="subtitle">Place workloads, then see which cluster-local index the serving workload can use.</p><section class="panel">
<div class="controls"><label class="control">Ingestion<select id="sourcePlace"><option>A</option><option>B</option><option>C</option></select></label><label class="control">Transform + join<select id="transformPlace"><option>A</option><option selected>B</option><option>C</option></select></label><label class="control">Application serving<select id="servePlace"><option>A</option><option>B</option><option selected>C</option></select></label><label class="control">Exploratory query<select id="explorePlace"><option selected>A</option><option>B</option><option>C</option></select></label><label class="control">Replica copies on serving cluster<strong><output id="replicaValue"></output></strong><input id="replicas" type="range" min="1" max="3" value="2"/></label></div>
<div class="clusters" id="clusters"></div><div class="status" id="status"></div><p class="note">Replicas are redundant full copies of the cluster's compute work, not shards. Indexes are local to their cluster; separate clusters isolate compute but require their own maintained state.</p>
</section></main><script src="./deployment-map.js?v=1"></script></body></html>
